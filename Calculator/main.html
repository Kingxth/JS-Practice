<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Calculeitor</title>
</head>
<body>
    <div id="wrapper">
        <div id="pantallita">
            <input type="text" placeholder=" TU RESULTADO ISNT HERE" id="pantalla"> 
        </div>
        <div class="botones">
            <div id="fila0">
                <button class="tecla" id="Cancelar">C</button>
                <button class="signo" id="division">/</button>
                <button class="signo" id="multiplicacion">*</button>
                <button class="signo" id="resta">-</button>
            </div>
            
            <div id="fila1">
                <button class="numero">7</button>
                <button class="numero">8</button>
                <button class="numero">9</button>
                <button class="signo" id="mas">+</button>
            </div>
            <div id="fila2">
                <button class="numero">4</button>
                <button class="numero">5</button>
                <button class="numero">6</button>
                
            </div>
            <div id="fila3">
                <button class="numero">1</button>
                <button class="numero">2</button>
                <button class="numero">3</button>
                <button class="tecla" id="enter">E</button>
            </div>
            <div id="fila4">
                <button class="numero" id="cero">0</button>
                <button class="signo" id="punto">.</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
